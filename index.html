<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập - V18.1</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    <style>
        :root { --primary: #1abc9c; --secondary: #2c3e50; --accent: #e74c3c; --bg: #f4f7f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg); padding-bottom: 50px; }
        header { background: var(--secondary); color: white; padding: 30px; text-align: center; }
        .container { display: flex; flex-wrap: wrap; padding: 20px 5%; gap: 20px; }
        .main-content, .sidebar { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .main-content { flex: 2; min-width: 350px; }
        .sidebar { flex: 1; min-width: 300px; height: fit-content; position: sticky; top: 20px; }
        input, select, button { width: 100%; padding: 12px; margin-bottom: 12px; border: 1px solid #ddd; border-radius: 8px; }
        .doc-item { border-bottom: 1px solid #eee; padding: 20px 0; display: flex; justify-content: space-between; align-items: center; }
        .badge { padding: 3px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: bold; color: white; background: var(--primary); margin-right: 5px; }
        #admin-lock { position: fixed; bottom: 15px; right: 15px; background: #333; color: white; padding: 10px 20px; border-radius: 30px; cursor: pointer; z-index: 100; font-size: 0.8rem; }
        .progress-container { height: 8px; background: #eee; border-radius: 4px; margin-bottom: 10px; display: none; overflow: hidden; }
        .progress-bar { height: 100%; background: var(--primary); width: 0%; transition: 0.3s; }
    </style>
</head>
<body>

    <div id="admin-lock" onclick="handleAdminAuth()">🛡️ Admin Login</div>

    <header>
        <h1>📚 Góc Học Tập - V18.1</h1>
        <p>Hệ thống chia sẻ tài liệu THPT</p>
    </header>

    <div class="container">
        <div class="main-content">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm tài liệu..." onkeyup="renderDocs()">
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px;">
                <select id="fGrade" onchange="renderDocs()"><option value="">-- Lớp --</option><option value="10">10</option><option value="11">11</option><option value="12">12</option></select>
                <select id="fSubject" onchange="renderDocs()">
                    <option value="">-- Môn học --</option>
                    <option value="Toán">Toán</option><option value="Vật lý">Vật lý</option><option value="Hóa học">Hóa học</option>
                    <option value="Sinh học">Sinh học</option><option value="Tin học">Tin học</option><option value="Ngữ văn">Ngữ văn</option>
                    <option value="Lịch sử">Lịch sử</option><option value="Địa lý">Địa lý</option><option value="KT&PL">KT&PL</option>
                    <option value="CNNN">CNNN</option><option value="CNCN">CNCN</option><option value="Khác">Khác</option>
                </select>
            </div>
            <div id="document-list">Đang tải dữ liệu...</div>
        </div>

        <div class="sidebar">
            <h2>Đăng Tài Liệu</h2>
            <input type="text" id="docName" placeholder="Tên tài liệu...">
            <select id="docGrade"><option value="10">Lớp 10</option><option value="11">Lớp 11</option><option value="12">Lớp 12</option></select>
            <select id="docSub">
                <option value="Toán">Toán</option><option value="Vật lý">Vật lý</option><option value="Hóa học">Hóa học</option>
                <option value="Sinh học">Sinh học</option><option value="Tin học">Tin học</option><option value="Ngữ văn">Ngữ văn</option>
                <option value="Lịch sử">Lịch sử</option><option value="Địa lý">Địa lý</option><option value="KT&PL">KT&PL</option>
                <option value="CNNN">CNNN</option><option value="CNCN">CNCN</option><option value="Khác">Khác</option>
            </select>
            <input type="file" id="fileInput">
            <div class="progress-container" id="progCont"><div class="progress-bar" id="progBar"></div></div>
            <button onclick="handleUpload()" id="btnSubmit" style="background: var(--primary); color: white; font-weight: bold;">GỬI TÀI LIỆU</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIBf30llPDcc53XUs7KBjjvF7fh1OLqDw",
            authDomain: "ght-v5.firebaseapp.com",
            projectId: "ght-v5",
            storageBucket: "ght-v5.firebasestorage.app",
            messagingSenderId: "850543407284",
            appId: "1:850543407284:web:50f6b96f9421d256f6a7e1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const storage = firebase.storage();
        let allDocs = [], isAdmin = false;

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-lock').innerText = user ? "🔓 Admin: " + user.email : "🛡️ Admin Login";
            renderDocs();
        });

        window.handleAdminAuth = async () => {
            if(isAdmin) return auth.signOut();
            const email = prompt("Email Admin:");
            const pass = prompt("Mật khẩu:");
            if(email && pass) try { await auth.signInWithEmailAndPassword(email, pass); } catch(e) { alert("Lỗi đăng nhập!"); }
        };

        window.handleUpload = async () => {
            const name = document.getElementById('docName').value;
            const file = document.getElementById('fileInput').files[0];
            const btn = document.getElementById('btnSubmit');
            if(!name || !file) return alert("Thiếu thông tin!");
            if(file.size > 10 * 1024 * 1024) return alert("File > 10MB!");

            btn.disabled = true;
            document.getElementById('progCont').style.display = 'block';
            const ref = storage.ref(`v18/${Date.now()}_${file.name}`);
            const task = ref.put(file);
            
            task.on('state_changed', s => {
                document.getElementById('progBar').style.width = (s.bytesTransferred/s.totalBytes)*100 + "%";
            }, e => { alert("Lỗi tải lên!"); btn.disabled = false; }, 
            async () => {
                const url = await ref.getDownloadURL();
                await db.collection("mod_docs").add({
                    title: name, grade: document.getElementById('docGrade').value,
                    subject: document.getElementById('docSub').value, data: url,
                    status: "pending", downloads: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
                alert("Đã gửi bài!"); location.reload();
            });
        };

        function renderDocs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const grade = document.getElementById('fGrade').value;
            const subject = document.getElementById('fSubject').value;
            const filtered = allDocs.filter(d => 
                (isAdmin ? d.status === "pending" : d.status === "approved") &&
                d.title.toLowerCase().includes(search) &&
                (grade === "" || d.grade === grade) && (subject === "" || d.subject === subject)
            );

            let html = "";
            filtered.forEach(d => {
                html += `
                    <div class="doc-item">
                        <div>
                            <span class="badge">Lớp ${d.grade}</span><span class="badge">${d.subject}</span>
                            <strong>${d.title}</strong>
                            <div style="font-size:0.8rem; color:var(--accent); margin-top:5px;">🔥 ${d.downloads} lượt</div>
                            ${isAdmin ? `<button onclick="db.collection('mod_docs').doc('${d.id}').update({status:'approved'})">✅ Duyệt</button>
                            <button onclick="if(confirm('Xóa?')) db.collection('mod_docs').doc('${d.id}').delete()">🗑️ Xóa</button>` : ''}
                        </div>
                        <button onclick="viewDoc('${d.id}','${d.data}')">XEM ↗</button>
                    </div>`;
            });
            document.getElementById('document-list').innerHTML = html || "Trống.";
        }

        window.viewDoc = async (id, url) => {
            await db.collection("mod_docs").doc(id).update({ downloads: firebase.firestore.FieldValue.increment(1) });
            window.open(url, '_blank');
        };

        db.collection("mod_docs").onSnapshot(s => {
            allDocs = s.docs.map(d => ({id: d.id, ...d.data()}));
            renderDocs();
        });
    </script>
</body>
</html>
