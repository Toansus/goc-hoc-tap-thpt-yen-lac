<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Góc Học Tập V18</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-storage-compat.js"></script>
    <style>
        :root { --primary: #1abc9c; --secondary: #2c3e50; --accent: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 20px; }
        .container { display: flex; flex-wrap: wrap; gap: 20px; max-width: 1200px; margin: auto; }
        .main-content, .sidebar { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .main-content { flex: 2; } .sidebar { flex: 1; min-width: 300px; }
        input, select, button { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 6px; border: 1px solid #ddd; }
        .doc-item { border-bottom: 1px solid #eee; padding: 15px 0; display: flex; justify-content: space-between; align-items: center; }
        .badge { background: var(--primary); color: white; padding: 2px 8px; border-radius: 10px; font-size: 0.7rem; }
        #admin-status { position: fixed; bottom: 10px; right: 10px; background: #333; color: white; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; cursor: pointer; }
    </style>
</head>
<body>

    <header style="text-align: center; margin-bottom: 30px;">
        <h1>📚 Góc Học Tập THPT</h1>
    </header>

    <div class="container">
        <div class="main-content">
            <input type="text" id="searchInput" placeholder="🔍 Tìm kiếm..." onkeyup="renderDocs()">
            <div id="document-list">Đang tải...</div>
        </div>

        <div class="sidebar">
            <h3>Đăng Tài Liệu</h3>
            <input type="text" id="docName" placeholder="Tên tài liệu...">
            <select id="docSubject">
                <option value="Toán">Toán</option><option value="Vật lý">Vật lý</option><option value="Hóa học">Hóa học</option>
                <option value="Sinh học">Sinh học</option><option value="Tin học">Tin học</option><option value="Ngữ văn">Ngữ văn</option>
                <option value="Lịch sử">Lịch sử</option><option value="Địa lý">Địa lý</option><option value="KT&PL">KT&PL</option>
                <option value="CNNN">CNNN</option><option value="CNCN">CNCN</option><option value="Khác">Khác</option>
            </select>
            <input type="file" id="fileInput">
            <button onclick="handlePost()" id="btnSubmit" style="background: var(--primary); color: white;">GỬI DUYỆT</button>
        </div>
    </div>

    <div id="admin-status" onclick="loginAdmin()">🛡️ Admin Login</div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAIBf30llPDcc53XUs7KBjjvF7fh1OLqDw",
            authDomain: "ght-v5.firebaseapp.com",
            projectId: "ght-v5",
            storageBucket: "ght-v5.firebasestorage.app",
            messagingSenderId: "850543407284",
            appId: "1:850543407284:web:50f6b96f9421d256f6a7e1"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const storage = firebase.storage();
        const auth = firebase.auth();
        let allDocs = [];
        let isAdmin = false;

        auth.onAuthStateChanged(user => {
            isAdmin = !!user;
            document.getElementById('admin-status').innerText = user ? "🔓 Admin: " + user.email : "🛡️ Admin Login";
            renderDocs();
        });

        async function loginAdmin() {
            if(isAdmin) return auth.signOut();
            const email = prompt("Email Admin:");
            const pass = prompt("Mật khẩu:");
            try { await auth.signInWithEmailAndPassword(email, pass); } catch(e) { alert("Lỗi!"); }
        }

        async function handlePost() {
            const name = document.getElementById('docName').value;
            const sub = document.getElementById('docSubject').value;
            const file = document.getElementById('fileInput').files[0];
            const btn = document.getElementById('btnSubmit');

            if(!name || !file) return alert("Thiếu thông tin!");
            if(file.size > 10 * 1024 * 1024) return alert("File quá lớn!");

            btn.disabled = true;
            const ref = storage.ref(`v18/${Date.now()}_${file.name}`);
            await ref.put(file);
            const url = await ref.getDownloadURL();

            await db.collection("mod_docs").add({
                title: name, subject: sub, data: url, status: "pending", downloads: 0, createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
            alert("Thành công!"); location.reload();
        }

        function renderDocs() {
            const search = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allDocs.filter(d => d.status === (isAdmin ? "pending" : "approved") && d.title.toLowerCase().includes(search));
            
            let html = "";
            filtered.forEach(d => {
                html += `<div class="doc-item">
                    <div><span class="badge">${d.subject}</span> <strong>${d.title}</strong></div>
                    <button onclick="window.open('${d.data}')">XEM</button>
                    ${isAdmin ? `<button onclick="db.collection('mod_docs').doc('${d.id}').update({status:'approved'})">DUYỆT</button>` : ''}
                </div>`;
            });
            document.getElementById('document-list').innerHTML = html || "Trống.";
        }

        db.collection("mod_docs").onSnapshot(s => {
            allDocs = s.docs.map(d => ({id: d.id, ...d.data()}));
            renderDocs();
        });
    </script>
</body>
</html>
